name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Unit and headless integration tests
        run: python -m pytest --junitxml=artifacts/junit.xml
      - name: M1 physics sanity checks
        run: python -m src.simulation.tools.validation.tipping_tests
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage.xml
            artifacts/junit.xml
          if-no-files-found: ignore
